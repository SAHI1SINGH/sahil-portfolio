<section class="bg-[#ff2a2a] pt-24 pb-32 px-6 md:px-12 w-full relative overflow-hidden font-sans">
  <div class="absolute top-0 left-0 w-full pointer-events-none z-10 -translate-y-[1px] rotate-180">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" class="w-full h-12 md:h-20 fill-[#0a0a0a]">
      <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.08,130.83,119.62,189.5,99.8,242.79,81.82,282.88,63.6,321.39,56.44Z"></path>
    </svg>
  </div>

  <div class="max-w-6xl mx-auto relative z-20">
    <div data-aos="fade-up" class="mb-16 md:mb-20 text-center">
      <h2 class="text-4xl md:text-5xl font-black text-black mb-4 tracking-tight uppercase">Work Experience</h2>
      <p class="text-red-100 text-base md:text-lg font-semibold max-w-lg mx-auto">
        Practical, hands-on experience building real-world products end to end.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8">
      <div
        *ngFor="let intern of internships; let i = index"
        data-aos="fade-up"
        [attr.data-aos-delay]="i * 150"
        class="bg-black/20 backdrop-blur-md border border-white/10 rounded-3xl p-8 hover:scale-[1.02] hover:bg-black/35 hover:shadow-[0_20px_50px_rgba(0,0,0,0.3)] transition-all duration-500 flex flex-col justify-between"
      >
        <div>
          <div class="flex justify-between items-start mb-6">
            <span class="text-white/40 text-xs font-mono font-bold tracking-widest uppercase">{{ intern.duration }}</span>
            <span class="bg-white/10 text-white text-[10px] font-black tracking-widest uppercase py-1 px-3 rounded-full border border-white/15">Role</span>
          </div>
          <h3 class="text-white text-2xl font-black mb-1 tracking-tight">{{ intern.role }}</h3>
          <p class="text-red-200 text-sm font-black tracking-wide mb-6 uppercase">{{ intern.organization }}</p>

          <div class="mb-6">
            <h4 class="text-white/60 text-xs font-bold uppercase tracking-wider mb-2">Focus Areas:</h4>
            <ul class="text-white/90 text-sm font-medium space-y-1 pl-4 list-disc">
              <li *ngFor="let skill of intern.skills">{{ skill }}</li>
            </ul>
          </div>
        </div>

        <div class="pt-4 border-t border-white/10">
          <h4 class="text-white/60 text-xs font-bold uppercase tracking-wider mb-3">Technologies:</h4>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let t of intern.tech" class="px-3 py-1 text-xs font-mono font-bold text-white bg-white/10 rounded-full border border-white/10 hover:bg-white/20 transition-all">
              {{ t }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="absolute bottom-10 left-10 text-black opacity-20 animate-pulse">
    <svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0l2.5 8.5L23 12l-8.5 2.5L12 23l-2.5-8.5L1 12l8.5-2.5z"/></svg>
  </div>
</section>
