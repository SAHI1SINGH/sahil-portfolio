<section id="creator" class="bg-[#0a0a0a] pt-24 pb-32 px-6 md:px-12 w-full relative overflow-hidden font-sans bg-[linear-gradient(to_right,#8080800a_1px,transparent_1px),linear-gradient(to_bottom,#8080800a_1px,transparent_1px)] bg-[size:80px_80px]">
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-red-600/5 rounded-full blur-[160px] pointer-events-none"></div>

  <div class="max-w-6xl mx-auto relative z-10">
    <div data-aos="fade-up" class="mb-16 md:mb-20">
      <div class="inline-block border border-white/20 rounded-full px-5 py-1.5 text-sm text-white/60 font-bold mb-6 shadow-sm bg-white/5 backdrop-blur-sm">
        {{ content.badge }}
      </div>
      <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-white leading-[1.1] mb-6 tracking-tight">
        {{ content.heading }}
      </h2>
      <p class="text-white/50 text-base md:text-lg max-w-xl font-medium leading-relaxed">
        {{ content.description }}
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
      <a *ngFor="let category of content.categories; let i = index" [href]="social.instagram" target="_blank" rel="noopener noreferrer" class="block">
        <div
          data-aos="fade-up"
          [attr.data-aos-delay]="i * 100"
          class="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-8 hover:scale-[1.02] hover:border-red-500/30 hover:shadow-[0_20px_50px_rgba(255,42,42,0.15)] transition-all duration-500 group flex flex-col justify-between"
        >
          <div>
            <div class="flex justify-between items-start mb-6">
              <span class="text-4xl p-3 bg-white/5 rounded-2xl group-hover:bg-[#ff2a2a]/10 group-hover:scale-110 transition-all duration-300">
                {{ category.icon }}
              </span>
              <span class="text-white/30 text-xs font-mono font-bold tracking-widest uppercase py-1 px-2 border border-white/5 rounded-full">
                {{ category.stats }}
              </span>
            </div>
            <h3 class="text-white text-xl md:text-2xl font-black mb-3 tracking-tight group-hover:text-[#ff2a2a] transition-colors">
              {{ category.title }}
            </h3>
            <p class="text-white/60 text-sm md:text-base leading-relaxed mb-6 font-medium">
              {{ category.description }}
            </p>
          </div>

          <div class="pt-4 border-t border-white/5 flex items-center justify-between text-xs font-mono tracking-wider font-bold text-white/40 group-hover:text-white transition-colors">
            <span>View More</span>
            <svg class="w-4 h-4 transform group-hover:translate-x-1.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </div>
        </div>
      </a>
    </div>

    <div data-aos="fade-up" data-aos-delay="400" class="mt-16 flex justify-center">
      <a [href]="social.instagram" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 px-8 py-4 rounded-full bg-[#ff2a2a] text-white font-bold text-lg hover:bg-red-600 hover:shadow-[0_0_30px_rgba(255,42,42,0.4)] transition-all duration-500 group">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path [attr.d]="icons.instagram" /></svg>
        Follow me on Instagram
        <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </a>
    </div>
  </div>
</section>
