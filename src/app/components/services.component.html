<section id="process" class="bg-white pt-24 pb-32 px-6 md:px-12 w-full relative overflow-hidden font-sans bg-[linear-gradient(to_right,#8080800a_1px,transparent_1px),linear-gradient(to_bottom,#8080800a_1px,transparent_1px)] bg-[size:80px_80px]">
  <div class="max-w-6xl mx-auto relative">

    <div data-aos="fade-up" class="w-full md:w-[450px] mb-16">
      <div class="inline-block border border-gray-300 rounded-full px-5 py-1.5 text-sm text-gray-600 font-bold mb-8 shadow-sm bg-white">
        {{ content.badge }}
      </div>
      <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-gray-900 leading-[1.1] mb-6 tracking-tight">
        {{ content.heading }}
      </h2>
      <p class="text-gray-500 text-base md:text-lg max-w-sm font-medium leading-relaxed">
        {{ content.description }}
      </p>
    </div>

    <div class="flex flex-col md:flex-row md:flex-wrap gap-8 md:gap-10 items-stretch justify-center">
      <div
        *ngFor="let card of content.cards; let i = index"
        data-aos="fade-up"
        [attr.data-aos-delay]="i * 120"
        class="w-full sm:w-80 rounded-[2rem] p-2 relative flex flex-col items-center bg-white border border-gray-200 shadow-[0_15px_40px_rgba(0,0,0,0.06)] hover:shadow-[0_20px_50px_rgba(0,0,0,0.12)] hover:scale-[1.02] transition-all duration-500"
      >
        <div class="w-5 h-5 bg-gradient-to-br from-gray-300 to-gray-100 rounded-full shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] absolute top-4 border border-gray-300 z-10 flex items-center justify-center">
          <div class="w-2 h-2 bg-gray-800 rounded-full opacity-20"></div>
        </div>

        <div class="w-full h-full rounded-[1.5rem] mt-8 p-8 flex flex-col min-h-[220px] bg-[#f4f4f4]">
          <span class="text-xl font-bold mb-2 font-serif italic text-gray-400">{{ card.number }}</span>
          <h3 class="text-2xl font-black mb-3 tracking-tight text-gray-900">{{ card.title }}</h3>
          <p class="text-sm leading-relaxed font-medium text-gray-500">{{ card.text }}</p>
        </div>
      </div>
    </div>

    <div data-aos="fade-in" data-aos-delay="500" class="hidden md:flex justify-end mt-10 pr-10">
      <span class="font-black text-2xl text-gray-600 -rotate-3">{{ content.endText }}</span>
    </div>
  </div>
</section>
