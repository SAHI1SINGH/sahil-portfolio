<nav
  class="fixed top-0 left-0 w-full z-50 transition-all duration-300"
  [ngClass]="isOpen ? 'bg-[#ff2a2a] py-4' : (isScrolled ? 'bg-transparent py-4' : 'bg-transparent py-6')"
>
  <div class="max-w-7xl mx-auto px-6 md:px-12 flex justify-between items-center">
    <div class="flex items-center">
      <a href="#" class="text-white text-2xl font-black tracking-tight whitespace-nowrap">
        {{ brandName }}<span class="text-red-500">.</span>
      </a>
    </div>

    <div class="hidden md:flex space-x-8">
      <a
        *ngFor="let link of navLinks"
        [href]="'#' + link.toLowerCase()"
        class="text-white/80 hover:text-white font-medium relative group transition-colors duration-300"
      >
        {{ link }}
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-red-500 transition-all duration-300 group-hover:w-full"></span>
      </a>
    </div>

    <div class="hidden md:block">
      <a
        [href]="hireMeMailto"
        class="px-6 py-2.5 rounded-full bg-white/10 border border-white/20 text-white font-semibold hover:bg-white/20 hover:shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-all duration-300 backdrop-blur-md"
      >
        Hire Me
      </a>
    </div>

    <div class="md:hidden flex items-center">
      <button (click)="toggle()" class="text-white focus:outline-none p-2">
        <svg *ngIf="!isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <div
    class="md:hidden absolute top-full left-0 w-full transition-all duration-300 overflow-hidden"
    [ngClass]="isOpen ? 'max-h-96 py-4 opacity-100 bg-[#ff2a2a] shadow-2xl' : 'max-h-0 opacity-0 bg-transparent'"
  >
    <div class="flex flex-col px-6 space-y-4">
      <a
        *ngFor="let link of navLinks"
        [href]="'#' + link.toLowerCase()"
        (click)="close()"
        class="text-white hover:text-black font-bold text-lg border-b border-white/20 pb-2 transition-colors"
      >
        {{ link }}
      </a>
      <div class="pt-4 pb-2">
        <a
          [href]="hireMeMailto"
          (click)="close()"
          class="inline-block px-6 py-3 rounded-full bg-white text-[#ff2a2a] font-black hover:bg-black hover:text-white transition-colors w-full text-center shadow-lg"
        >
          Hire Me
        </a>
      </div>
    </div>
  </div>
</nav>
