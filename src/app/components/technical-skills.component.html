<section id="skills" class="bg-[#0a0a0a] pt-24 pb-28 px-6 md:px-12 w-full relative overflow-hidden font-sans">
  <div class="absolute top-1/4 left-10 w-96 h-96 bg-red-600/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-10 w-96 h-96 bg-red-500/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="max-w-6xl mx-auto relative z-10">
    <div data-aos="fade-up" class="mb-16 text-center">
      <div class="inline-block border border-white/20 rounded-full px-5 py-1.5 text-sm text-white/60 font-bold mb-6 shadow-sm bg-white/5 backdrop-blur-sm">
        Technical Stack
      </div>
      <h2 class="text-4xl md:text-5xl font-black text-white tracking-tight mb-4 uppercase">My Skillset</h2>
      <p class="text-white/50 text-base md:text-lg max-w-xl mx-auto leading-relaxed">
        A comprehensive overview of my programming languages, frameworks, databases, and engineering concepts.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
      <div
        *ngFor="let category of categories; let i = index"
        data-aos="fade-up"
        [attr.data-aos-delay]="i * 100"
        class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-6 hover:scale-[1.02] hover:border-red-500/30 hover:shadow-[0_20px_50px_rgba(255,42,42,0.1)] transition-all duration-500"
      >
        <h3 class="text-white text-lg font-black tracking-tight mb-6 pb-2 border-b border-white/10 uppercase">
          {{ category.title }}
        </h3>
        <div>
          <div *ngFor="let skill of category.skills" class="mb-4">
            <div class="flex justify-between items-center mb-1">
              <span class="text-white text-sm font-semibold tracking-wide">{{ skill.name }}</span>
              <span class="text-red-400 text-xs font-bold font-mono">{{ skill.level }}%</span>
            </div>
            <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden border border-white/5">
              <div class="h-full bg-gradient-to-r from-red-600 to-red-400 rounded-full transition-all duration-1000 ease-out" [style.width.%]="skill.level"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
