<section class="relative w-full h-screen overflow-hidden bg-black">
  <!-- Fallback gradient (shows if the video fails to load, or behind it while loading) -->
  <div class="absolute top-0 left-0 w-full h-full z-0 bg-[radial-gradient(circle_at_80%_20%,rgba(255,42,42,0.20),transparent_55%),linear-gradient(160deg,#1a0000_0%,#000_55%)]"></div>

  <!-- Background video — put your file at public/videos/hero-video.mp4 (see public/videos/README.md) -->
  <video
    #heroVideo
    [src]="videoSrc"
    muted
    playsinline
    (ended)="onVideoEnded()"
    class="absolute top-0 left-0 w-full h-full object-cover z-[1]"
  >
    Your browser does not support the video tag.
  </video>

  <!-- Dark overlay so text stays readable over the video -->
  <div class="absolute top-0 left-0 w-full h-full z-[2] bg-black/30"></div>

  <!-- Left floating social bar (desktop) -->
  <div class="hidden lg:flex flex-col gap-6 fixed left-6 top-1/2 -translate-y-1/2 z-50 mix-blend-difference">
    <a [href]="social.github" target="_blank" rel="noopener noreferrer" class="text-white/60 hover:text-white transition-all duration-300 transform hover:scale-125" aria-label="GitHub">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" [attr.d]="icons.github" clip-rule="evenodd" /></svg>
    </a>
    <a [href]="social.linkedin" target="_blank" rel="noopener noreferrer" class="text-white/60 hover:text-white transition-all duration-300 transform hover:scale-125" aria-label="LinkedIn">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path [attr.d]="icons.linkedin" /></svg>
    </a>
    <a [href]="social.instagram" target="_blank" rel="noopener noreferrer" class="text-white/60 hover:text-[#ff2a2a] transition-all duration-300 transform hover:scale-125" aria-label="Instagram">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path [attr.d]="icons.instagram" /></svg>
    </a>
  </div>

  <div class="absolute inset-0 z-20 px-6 pb-20 md:pb-[8%] md:px-12 max-w-7xl mx-auto flex flex-col md:flex-row justify-end md:justify-between items-start md:items-end text-left w-full">
    <div class="flex flex-col items-start text-left max-w-2xl w-full">
      <div data-aos="fade-up" data-aos-delay="100" class="flex items-center gap-4 mb-4 lg:hidden">
        <a [href]="social.github" target="_blank" rel="noopener noreferrer" class="text-white/60 hover:text-white" aria-label="GitHub">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" [attr.d]="icons.github" clip-rule="evenodd" /></svg>
        </a>
        <a [href]="social.linkedin" target="_blank" rel="noopener noreferrer" class="text-white/60 hover:text-white" aria-label="LinkedIn">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path [attr.d]="icons.linkedin" /></svg>
        </a>
        <a [href]="social.instagram" target="_blank" rel="noopener noreferrer" class="text-white/60 hover:text-[#ff2a2a]" aria-label="Instagram">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path [attr.d]="icons.instagram" /></svg>
        </a>
      </div>

      <h1 data-aos="fade-up" class="text-white text-3xl md:text-5xl font-bold mb-4 tracking-tight">
        {{ hero.greeting }}, <br />
        <span class="text-transparent [-webkit-text-stroke:1.5px_white]">{{ hero.titleHighlight }}</span>
      </h1>

      <p data-aos="fade-up" data-aos-delay="200" class="text-white text-sm md:text-lg font-semibold mb-8 max-w-md drop-shadow-md">
        {{ hero.subtitle }}
      </p>

      <div data-aos="fade-up" data-aos-delay="400" class="flex flex-row flex-wrap items-center gap-3 w-full">
        <a [href]="hero.ctaPrimary.href" class="px-4 py-2 md:px-6 md:py-2 text-xs md:text-base rounded-full bg-white text-black font-semibold hover:bg-gray-200 transition-all duration-300 transform hover:scale-105 shadow-md">
          {{ hero.ctaPrimary.text }}
        </a>
        <a [href]="hero.ctaSecondary.href" class="px-4 py-2 md:px-6 md:py-2 text-xs md:text-base rounded-full bg-black/40 border border-white text-white font-semibold hover:bg-black/60 transition-all duration-300 backdrop-blur-md">
          {{ hero.ctaSecondary.text }}
        </a>
        <a [href]="hero.ctaResume.href" download class="px-4 py-2 md:px-6 md:py-2 text-xs md:text-base rounded-full bg-transparent border border-white/50 text-white font-semibold hover:bg-white hover:text-black transition-all duration-300 backdrop-blur-md flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          {{ hero.ctaResume.text }}
        </a>
      </div>
    </div>

    <!-- Right Side: Play Video Button -->
    <div
      data-aos="zoom-in"
      data-aos-delay="600"
      class="mt-8 md:mt-0 flex flex-row md:flex-col items-center gap-2 md:gap-3 cursor-pointer group self-start md:self-auto"
      (click)="toggleVideo()"
    >
      <div class="w-12 h-12 md:w-20 md:h-20 rounded-full border border-white/30 bg-black/20 backdrop-blur-md flex justify-center items-center group-hover:scale-110 group-hover:bg-[#ff2a2a] transition-all duration-500 shadow-[0_0_30px_rgba(255,255,255,0.1)] group-hover:shadow-[0_0_40px_rgba(255,42,42,0.6)]">
        <svg *ngIf="!isPlaying" class="w-5 h-5 md:w-8 md:h-8 text-white ml-0.5 md:ml-1" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
        <svg *ngIf="isPlaying" class="w-5 h-5 md:w-8 md:h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
      </div>
      <span class="text-white text-[10px] md:text-xs font-bold tracking-widest uppercase opacity-70 group-hover:opacity-100 transition-opacity">
        {{ isPlaying ? 'Pause' : 'Play Reel' }}
      </span>
    </div>
  </div>

  <div data-aos="fade-up" data-aos-delay="800" class="hidden md:block absolute bottom-8 left-1/2 transform -translate-x-1/2 z-20 pointer-events-none">
    <div class="animate-bounce">
      <svg class="w-6 h-6 text-white drop-shadow-[0_1px_2px_rgba(0,0,0,0.6)]" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
      </svg>
    </div>
  </div>
</section>
