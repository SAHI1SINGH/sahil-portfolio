<section id="projects" class="bg-[#0a0a0a] pt-24 pb-32 px-6 md:px-12 w-full relative overflow-hidden font-sans bg-[linear-gradient(to_right,#8080800a_1px,transparent_1px),linear-gradient(to_bottom,#8080800a_1px,transparent_1px)] bg-[size:80px_80px]">
  <div class="max-w-6xl mx-auto">

    <div data-aos="fade-up" class="mb-16 md:mb-20">
      <div class="inline-block border border-white/20 rounded-full px-5 py-1.5 text-sm text-white/60 font-bold mb-8 shadow-sm bg-white/5 backdrop-blur-sm">
        Featured Projects
      </div>
      <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-white leading-[1.1] mb-6 tracking-tight">
        Work that speaks <br class="hidden md:block" />for itself
      </h2>
      <p class="text-white/50 text-base md:text-lg max-w-lg font-medium leading-relaxed">
        A selection of projects that showcase my expertise in full-stack development and modern architecture.
      </p>
    </div>

    <div class="flex flex-col gap-6 md:gap-8">
      <div
        *ngFor="let project of projects; let i = index"
        data-aos="fade-up"
        [attr.data-aos-delay]="(i + 1) * 100"
        class="relative rounded-2xl p-[1px] group transition-all duration-500"
        [ngClass]="project.isFlagship ? 'bg-gradient-to-br from-red-500/50 via-white/10 to-red-500/30 hover:from-red-500 hover:via-red-400/30 hover:to-red-500/60' : 'bg-white/10 hover:bg-white/20'"
      >
        <div class="rounded-2xl p-6 md:p-8 h-full backdrop-blur-md transition-all duration-500" [ngClass]="project.isFlagship ? 'bg-[#0f0f0f]/95 group-hover:bg-[#0f0f0f]/90' : 'bg-[#111111]/90 group-hover:bg-[#111111]/80'">

          <span *ngIf="project.badge" class="inline-block text-xs font-bold tracking-widest uppercase text-red-400 bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20 mb-4">
            {{ project.badge }}
          </span>

          <div class="flex items-baseline gap-4 mb-4">
            <span class="text-5xl font-black text-white/10 font-serif italic">{{ project.number }}</span>
            <h3 class="text-2xl md:text-3xl font-black text-white tracking-tight">{{ project.title }}</h3>
          </div>

          <p class="text-white/60 text-sm md:text-base leading-relaxed mb-6 max-w-2xl font-medium">
            {{ project.description }}
          </p>

          <div class="flex flex-wrap gap-2 mb-8">
            <span *ngFor="let tag of project.techTags" class="px-3 py-1 text-xs font-bold text-white/70 bg-white/5 rounded-full border border-white/10 hover:bg-red-500/20 hover:border-red-500/30 hover:text-red-300 transition-all duration-300 cursor-default">
              {{ tag }}
            </span>
          </div>

          <div class="flex flex-wrap gap-3">
            <a *ngIf="project.links.github" [href]="project.links.github" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 border border-white/20 text-white text-sm font-semibold hover:bg-white hover:text-black transition-all duration-300">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" [attr.d]="icons.github" clip-rule="evenodd" /></svg>
              GitHub
            </a>
          </div>
        </div>
      </div>
    </div>

    <div data-aos="fade-up" data-aos-delay="500" class="mt-16 flex justify-center">
      <a [href]="social.github" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 px-8 py-4 rounded-full border border-white/20 text-white font-bold text-lg hover:bg-white hover:text-black hover:shadow-[0_0_30px_rgba(255,255,255,0.15)] transition-all duration-500 group">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" [attr.d]="icons.github" clip-rule="evenodd" /></svg>
        Explore All My Repositories
        <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </a>
    </div>
  </div>
</section>
