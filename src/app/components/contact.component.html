<section #sectionRef id="contact" class="bg-[#0a0a0a] w-full min-h-screen relative overflow-hidden flex items-end pt-32 pb-0 border-t border-gray-900">
  <!-- Huge background text with lightweight parallax -->
  <div
    class="absolute top-0 left-0 w-full h-full flex flex-col justify-start items-center overflow-hidden pointer-events-none z-0 pt-16 md:pt-12"
    [style.transform]="'translateY(' + parallaxY + '%)'"
  >
    <h1 class="text-[25vw] leading-[0.75] font-black text-white uppercase tracking-tighter select-none scale-y-[1.6] origin-top" style="font-family: 'Impact', 'Arial Black', sans-serif;">
      Contact
    </h1>
  </div>

  <div class="relative z-10 w-full flex justify-end items-end">
    <div data-aos="fade-up" class="bg-[#ff2a2a] w-full md:w-[85%] lg:w-[75%] p-8 md:p-16 text-white flex flex-col justify-between">
      <div class="flex flex-col sm:flex-row justify-between items-start gap-8 mb-12">
        <div class="text-xs font-bold tracking-[0.2em] uppercase opacity-90">Reach Me</div>
        <a [href]="social.instagram" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 text-xs font-black uppercase tracking-wider bg-white/10 hover:bg-white hover:text-red-600 border border-white/20 px-4 py-2 rounded-full transition-all duration-300">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path [attr.d]="icons.instagram" /></svg>
          DM on Instagram
        </a>
      </div>

      <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)" class="flex flex-col gap-12 md:gap-16 w-full">
        <div class="flex flex-col md:flex-row gap-12 md:gap-20 w-full">
          <div class="flex-1 flex flex-col gap-10">
            <input type="text" name="firstName" placeholder="First Name" required [(ngModel)]="firstName"
              class="w-full bg-transparent border-b border-white/40 pb-3 text-lg focus:outline-none focus:border-white transition-colors placeholder-white font-medium rounded-none" />
            <input type="text" name="lastName" placeholder="Last Name" [(ngModel)]="lastName"
              class="w-full bg-transparent border-b border-white/40 pb-3 text-lg focus:outline-none focus:border-white transition-colors placeholder-white font-medium rounded-none" />
            <input type="email" name="email" placeholder="Email" required [(ngModel)]="email"
              class="w-full bg-transparent border-b border-white/40 pb-3 text-lg focus:outline-none focus:border-white transition-colors placeholder-white font-medium rounded-none" />
          </div>

          <div class="flex-1 flex flex-col">
            <textarea name="message" placeholder="Type your message here" required [(ngModel)]="message"
              class="w-full h-full min-h-[120px] bg-transparent border-b border-white/40 pb-3 text-lg focus:outline-none focus:border-white transition-colors placeholder-white font-medium resize-none rounded-none"></textarea>
          </div>
        </div>

        <div class="flex flex-col md:flex-row gap-12 mt-4">
          <div class="flex-1 flex items-start gap-4 text-sm font-medium text-white/90">
            <input type="checkbox" id="permission" name="permission" [(ngModel)]="permission"
              class="mt-1 w-4 h-4 rounded-sm border-white/40 bg-transparent text-white cursor-pointer" style="accent-color: white;" />
            <label for="permission" class="cursor-pointer max-w-[280px] leading-snug">
              I give permission to contact me at this email address.
            </label>
          </div>

          <div class="flex-1 flex flex-col gap-8 text-xs text-white/70 font-medium">
            <p class="leading-relaxed max-w-[400px]">
              Your message will be sent directly to my inbox. I typically respond within 24-48 hours.
            </p>
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-6">
              <p class="max-w-[250px] leading-relaxed">
                For urgent inquiries, reach me at
                <a [href]="'mailto:' + personalInfo.emails.primary" class="underline hover:text-white transition-colors">{{ personalInfo.emails.primary }}</a>
              </p>

              <button
                type="submit"
                [disabled]="status === 'sending'"
                class="px-8 py-3 rounded-full border border-white/40 text-white font-bold flex items-center justify-center gap-3 transition-all duration-300 group whitespace-nowrap self-start sm:self-auto"
                [ngClass]="{
                  'opacity-50 cursor-not-allowed bg-white/10': status === 'sending',
                  'bg-green-600 border-green-500 shadow-[0_0_20px_rgba(22,163,74,0.4)]': status === 'success',
                  'bg-red-800 border-red-700': status === 'error',
                  'hover:bg-white hover:text-[#ff2a2a]': status === 'idle'
                }"
              >
                <span *ngIf="status === 'sending'">Sending...</span>
                <span *ngIf="status === 'success'">Sent Successfully ✓</span>
                <span *ngIf="status === 'error'">Please fill required fields</span>
                <span *ngIf="status === 'idle'">Send Message</span>
                <svg *ngIf="status === 'idle'" class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
