name: Deploy Angular Portfolio

on:
  push:
    branches:
      - sahil-day1

# Give GitHub Actions permission to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # =========================
  # BUILD ANGULAR APPLICATION
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:

      # Get our project from GitHub
      - name: Checkout
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Build Angular application
      - name: Build Angular
        run: npm run build -- --base-href /sahil-portfolio/

      # Upload the Angular build
      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/portfolio/browser


  # =========================
  # DEPLOY TO GITHUB PAGES
  # =========================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4